services:
  postgres:
    image: postgres:16-alpine
    container_name: adminhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adminhub
      POSTGRES_PASSWORD: adminhub
      POSTGRES_DB: adminhub
    ports:
      - '5433:5432'
    volumes:
      - adminhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adminhub -d adminhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adminhub_pgdata:
