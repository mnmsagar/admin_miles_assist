services:
  postgres:
    image: postgres:16-alpine
    container_name: adminhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-adminhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminhub}
      POSTGRES_DB: ${DB_NAME:-adminhub}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - adminhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-adminhub} -d ${DB_NAME:-adminhub}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adminhub_pgdata:
